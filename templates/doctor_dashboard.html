{% extends "base.html" %}

{% block content %}
<!-- Top Header Bar -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="m-0">Welcome Dr. Abcde</h3>
    <a href="/logout" class="text-decoration-none text-dark">logout</a>
</div>

<!-- Upcoming Appointments -->
<div class="card shadow-sm mb-4 border-dark">
    <div class="card-header bg-white border-dark">
        <h5 class="m-0">Upcoming Appointments</h5>
    </div>
    <div class="card-body p-0">
        <table class="table table-bordered mb-0 border-dark">
            <thead class="table-light">
                <tr>
                    <th>Sr No.</th>
                    <th>Patient Name</th>
                    <th>Patient History</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="align-middle">1001.</td>
                    <td class="align-middle">Mr. abcde</td>
                    <td class="align-middle"><button class="btn btn-sm btn-outline-info">update</button></td>
                    <td class="align-middle">
                        <button class="btn btn-sm btn-outline-success">mark as complete</button>
                        <button class="btn btn-sm btn-outline-danger">cancel</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Assigned Patients -->
<div class="card shadow-sm mb-4 border-dark">
    <div class="card-header bg-white border-dark">
        <h5 class="m-0">Assigned Patients</h5>
    </div>
    <div class="card-body p-0">
        <table class="table table-bordered mb-0 border-dark">
            <tbody>
                <tr>
                    <td class="align-middle">Mr. abcde</td>
                    <td class="text-end" style="width: 100px;">
                        <button class="btn btn-sm btn-outline-info px-3">view</button>
                    </td>
                </tr>
                <tr>
                    <td class="align-middle">Miss. Pqrst</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-info px-3">view</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <!-- Provide Availability Button aligned to the right below the table -->
    <div class="card-footer bg-white text-end border-dark">
        <button class="btn btn-outline-success">Provide Availability</button>
    </div>
</div>
{% endblock %}
