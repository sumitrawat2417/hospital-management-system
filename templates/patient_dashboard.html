{% extends "base.html" %}

{% block content %}
<!-- Top Header Bar -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="m-0">Welcome Pqrst</h3>
    <div>
        <a href="#" class="text-decoration-none text-dark me-2">edit profile</a> | 
        <a href="#" class="text-decoration-none text-dark mx-2">History</a> | 
        <a href="/logout" class="text-decoration-none text-dark ms-2">logout</a>
    </div>
</div>

<!-- Departments List -->
<div class="card shadow-sm mb-4 border-dark">
    <div class="card-header bg-white border-dark">
        <h5 class="m-0">Departments</h5>
    </div>
    <div class="card-body p-0">
        <table class="table table-bordered mb-0 border-dark">
            <tbody>
                <tr>
                    <td class="align-middle">Cardiology</td>
                    <td class="text-end" style="width: 150px;">
                        <button class="btn btn-sm btn-outline-info px-3">view details</button>
                    </td>
                </tr>
                <tr>
                    <td class="align-middle">Oncology</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-info px-3">view details</button>
                    </td>
                </tr>
                <tr>
                    <td class="align-middle">General</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-info px-3">view details</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Upcoming Appointments Table -->
<div class="card shadow-sm mb-4 border-dark">
    <div class="card-header bg-white border-dark">
        <h5 class="m-0">Upcoming Appointments</h5>
    </div>
    <div class="card-body p-0">
        <table class="table table-bordered mb-0 border-dark">
            <thead class="table-light">
                <tr>
                    <th>Sr No.</th>
                    <th>Doctor Name</th>
                    <th>Deptt</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="align-middle">1001.</td>
                    <td class="align-middle">Dr. abcde</td>
                    <td class="align-middle">general</td>
                    <td class="align-middle">24/09/2025</td>
                    <td class="align-middle">08 am - 12 pm</td>
                    <td class="align-middle">
                        <button class="btn btn-sm btn-outline-danger">cancel</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
