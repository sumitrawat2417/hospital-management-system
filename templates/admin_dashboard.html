{% extends "base.html" %}

{% block content %}
<!-- Top Header Bar -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="m-0">Welcome Admin</h3>
    <form class="d-flex" method="GET" action="/search">
        <input class="form-control me-2" type="search" placeholder="doctor, patient, department..." name="query">
        <button class="btn btn-outline-primary" type="submit">search</button>
    </form>
</div>

<!-- Registered Doctors -->
<div class="card mb-4 shadow-sm border-dark">
    <div class="card-header bg-white d-flex justify-content-between align-items-center border-dark">
        <h5 class="m-0">Registered Doctors</h5>
        <a href="/admin/add_doctor" class="btn btn-sm btn-outline-success px-3">create</a>
    </div>
    <div class="card-body p-0">
        <table class="table table-bordered mb-0 border-dark">
            <tbody>
                <tr>
                    <td class="align-middle">Dr. abcde</td>
                    <td class="text-end" style="width: 250px;">
                        <button class="btn btn-sm btn-outline-warning">edit</button>
                        <button class="btn btn-sm btn-outline-danger">delete</button>
                        <button class="btn btn-sm btn-dark">blacklist</button>
                    </td>
                </tr>
                <tr>
                    <td class="align-middle">Dr. Pqrst</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-warning">edit</button>
                        <button class="btn btn-sm btn-outline-danger">delete</button>
                        <button class="btn btn-sm btn-dark">blacklist</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Registered Patients -->
<div class="card mb-4 shadow-sm border-dark">
    <div class="card-header bg-white border-dark">
        <h5 class="m-0">Registered Patients</h5>
    </div>
    <div class="card-body p-0">
        <table class="table table-bordered mb-0 border-dark">
            <tbody>
                <tr>
                    <td class="align-middle">Mr. abcde</td>
                    <td class="text-end" style="width: 250px;">
                        <button class="btn btn-sm btn-outline-warning">edit</button>
                        <button class="btn btn-sm btn-outline-danger">delete</button>
                        <button class="btn btn-sm btn-dark">blacklist</button>
                    </td>
                </tr>
                <tr>
                    <td class="align-middle">Miss. Pqrst</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-warning">edit</button>
                        <button class="btn btn-sm btn-outline-danger">delete</button>
                        <button class="btn btn-sm btn-dark">blacklist</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Upcoming Appointments -->
<div class="card shadow-sm mb-4 border-dark">
    <div class="card-header bg-white border-dark">
        <h5 class="m-0">Upcoming Appointments</h5>
    </div>
    <div class="card-body p-0">
        <table class="table table-bordered mb-0 border-dark">
            <thead class="table-light">
                <tr>
                    <th>Sr No.</th>
                    <th>Patient Name</th>
                    <th>Doctor Name</th>
                    <th>Department</th>
                    <th>Patient History</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1001.</td>
                    <td>Mr. abcde</td>
                    <td>Dr. pqrst</td>
                    <td>Cardiology</td>
                    <td><button class="btn btn-sm btn-outline-info px-3">view</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
