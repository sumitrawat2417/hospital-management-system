{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <!-- Using text-danger (red) to make the admin dashboard look distinct -->
        <h2 class="text-danger">Admin Dashboard</h2>
        <p class="lead">Hospital Overview & Management</p>
    </div>
</div>

<!-- Stats Row: 3 boxes across the screen -->
<div class="row mb-4">
    <div class="col-md-4">
        <div class="card bg-primary text-white shadow-sm text-center p-3">
            <h3>12</h3>
            <p class="mb-0">Total Doctors</p>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card bg-success text-white shadow-sm text-center p-3">
            <h3>145</h3>
            <p class="mb-0">Total Patients</p>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card bg-info text-white shadow-sm text-center p-3">
            <h3>32</h3>
            <p class="mb-0">Appointments Today</p>
        </div>
    </div>
</div>

<!-- Management Section -->
<div class="card shadow-sm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0 text-primary">Manage Doctors</h5>
        <!-- Button linking to the add doctor form -->
        <a href="/admin/add_doctor" class="btn btn-sm btn-primary">+ Add New Doctor</a>
    </div>
    <div class="card-body">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Specialization</th>
                    <th>Experience</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Hardcoded for now until we have database loop -->
                <tr>
                    <td>1</td>
                    <td>Dr. Smith</td>
                    <td>Cardiology</td>
                    <td>10 Years</td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger">Remove</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
