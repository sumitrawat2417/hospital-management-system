<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    
    <!-- 1. BOOTSTRAP CSS: This makes everything look modern automatically -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- 2. NAVIGATION BAR: This will appear on EVERY page of your app -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <!-- Brand Logo/Name -->
            <a class="navbar-brand fw-bold" href="/">🏥 Hospital System</a>
            
            <!-- This button appears on mobile screens to toggle the menu -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Navbar Links (We will update these later based on who is logged in) -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 3. MAIN CONTENT AREA -->
    <!-- 'container' centers the content. 'mt-4' gives it Margin-Top spacing -->
    <div class="container mt-4">
        
        <!-- ========================================== -->
        <!-- THIS IS THE HOLE WHERE OTHER PAGES GO IN! -->
        {% block content %}
        
        {% endblock %}
        <!-- ========================================== -->

    </div>

    <!-- 4. BOOTSTRAP JS: Required for things like mobile menus to click open -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
